<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bug Hunter: Learn to Code</title>
<meta name="description" content="Bug Hunter — تعلّم البرمجة وإنت بتصيد البقّات. Learn to code by hunting bugs.">
<style>
  :root { --bg:#07080F; --panel:#0F1220; --line:#232842; --text:#F2F4FF; --dim:#9AA3C7; --c1:#4DE1FF; --c2:#8B5CFF; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background: radial-gradient(800px 500px at 15% 0%, rgba(77,225,255,.14), transparent), radial-gradient(700px 500px at 95% 40%, rgba(139,92,255,.12), transparent), var(--bg); color:var(--text); font-family: system-ui, "Segoe UI", Tahoma, sans-serif; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  main { max-width:560px; width:100%; text-align:center; }
  .logo { width:112px; height:112px; margin:0 auto 22px; border-radius:36px; background:linear-gradient(135deg,var(--c1),var(--c2)); display:grid; place-items:center; font-size:58px; box-shadow:0 18px 50px -12px rgba(77,225,255,.35); }
  h1 { margin:0 0 6px; font-size:34px; letter-spacing:1px; }
  p { color:var(--dim); line-height:1.7; margin:0 0 6px; }
  .btn { display:inline-block; margin-top:22px; padding:14px 28px; border-radius:16px; background:linear-gradient(90deg,var(--c1),var(--c2)); color:#07080F; font-weight:800; text-decoration:none; }
  .card { margin-top:28px; padding:16px; border:1px solid var(--line); background:var(--panel); border-radius:20px; font-size:14px; }
  a { color:var(--c1); }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">🐞</div>
  <h1>BUG HUNTER</h1>
  <p>تعلّم البرمجة وإنت بتصيد البقّات</p>
  <p dir="ltr">Learn to code by hunting bugs — 13 languages, C++ from zero to OOP.</p>
  <a class="btn" href="https://play.google.com/store/apps/details?id=com.amer.bughunter">حمّلها من Google Play</a>
  <div class="card">
    <p>Developer: Amer Aldalaq</p>
  </div>
</main>
</body>
</html>
